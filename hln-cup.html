    txt.split(/[\n,;]+/).forEach(function (x) { x = rapi(x); if (!x) return; var k = x.toLowerCase(); if (seen[k]) return; seen[k] = 1; out.push(x); });

  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function create(names, rnd, third) {

    var slots = seedOrder(S).map(function (s) { return s <= n ? seeds[s - 1] : null; });
    return { v: 1, title: "HLN81 CUP", n: n, S: S, slots: slots, third: !!third && S >= 4, results: {}, ts: Date.now(), date: new Date().toISOString().slice(0, 10) };
  }
  function resolve(mt, st) {
    var res = st.results[mt.id];
    if (mt.r === 0 && ((mt.p1 === null) !== (mt.p2 === null))) { mt.bye = true; mt.winner = mt.p1 || mt.p2; mt.done = true; return; }
    if (mt.p1 && mt.p2 && res && res.a === mt.p1 && res.b === mt.p2) {
      mt.s1 = res.s1; mt.s2 = res.s2; mt.pw = res.pw || null;

        if (r === 0) { mt.p1 = st.slots[2 * m]; mt.p2 = st.slots[2 * m + 1]; }

  var syncCfg = (function () { try { return JSON.parse(lsGet(LS_SYNC) || "{}"); } catch (e) { return {}; } })();

    var pos = {}, R = D.R, r, m, h0 = st.S / 2;
    for (r = 0; r < R; r++) D.rounds[r].forEach(function (mt) {
      var y = r === 0 ? PADT + mt.m * UNIT : (pos[D.rounds[r - 1][2 * mt.m].id].y + pos[D.rounds[r - 1][2 * mt.m + 1].id].y) / 2;
      pos[mt.id] = { x: PADL + r * (CW + GX), y: y };
    });
    var H = PADT + h0 * UNIT, fy = pos[D.fin.id].y, fx = pos[D.fin.id].x;
    if (D.third) { pos.third = { x: fx, y: fy + CH + 70 }; H = Math.max(H, pos.third.y + CH + 14); }
    return { pos: pos, W: PADL + (R + 1) * (CW + GX), H: H + 6, cup: { x: fx + CW + GX - 6, y: fy + CH / 2 - 52 } };
  }
  function playerRow(mt, which, canEdit) {
    var p = which === 1 ? mt.p1 : mt.p2, s = which === 1 ? mt.s1 : mt.s2;
    if (!p) return "<div class='bp tbd'><span class='n'>" + (mt.r === 0 && mt.bye ? "BYE" : "menunggu pemenang") + "</span><span class='s'></span></div>";
    var cls = "bp", isW = mt.done && mt.winner === p, isL = mt.done && mt.loser === p && !mt.bye;
    if (isW) cls += " win"; if (isL) cls += " lose"; if (sel === p) cls += " sel";
    return "<div class='" + cls + "' data-p='" + esc(p) + "'><span class='n'>" + esc(p) + (isW && mt.pw ? "<span class='pen'>PEN</span>" : "") + "</span><span class='s'>" + (s === null || s === undefined ? "" : s) + "</span></div>";
  }
  function cardHtml(mt, pos, ready) {
    var inv = sel && (mt.p1 === sel || mt.p2 === sel);
    var cls = "bm" + (ready ? " ready" : "") + (sel && !inv ? " dim" : "") + (mt.isThird ? "" : "") + (ADMIN && mt.p1 && mt.p2 && !mt.bye ? " adm" : "");
    return "<div class='" + cls + "' data-id='" + mt.id + "' style='left:" + pos.x + "px;top:" + pos.y + "px;width:" + CW + "px;height:" + CH + "px'>" +
      (ready ? "<span class='tag'>SIAP MAIN</span>" : "") + playerRow(mt, 1) + playerRow(mt, 2) + "</div>";
  }
  function renderBoard(D) {
    var L = layout(D, state), rd = {}, h = "", svg = "";
    readyList(D).forEach(function (m) { rd[m.id] = 1; });
    D.rounds.forEach(function (rr, r) {
      h += "<div class='bhead' style='left:" + (PADL + r * (CW + GX)) + "px;top:8px;width:" + CW + "px'>" + roundName(r, D.R) + "</div>";
      rr.forEach(function (mt) {
        if (r > 0) [D.rounds[r - 1][2 * mt.m], D.rounds[r - 1][2 * mt.m + 1]].forEach(function (f) {
          var a = L.pos[f.id], b = L.pos[mt.id], x1 = a.x + CW, y1 = a.y + CH / 2, x2 = b.x, y2 = b.y + CH / 2, xm = (x1 + x2) / 2;
          var c = "bline" + (f.done && f.winner ? " win" : "") + (sel ? (f.winner === sel && (mt.p1 === sel || mt.p2 === sel) ? " hl" : " dim") : "");
          svg += "<path class='" + c + "' d='M" + x1 + " " + y1 + "H" + xm + "V" + y2 + "H" + x2 + "'/>";
        });
        h += cardHtml(mt, L.pos[mt.id], rd[mt.id]);
      });
    });
    // trophy + garis ke piala
    var fp = L.pos[D.fin.id];
    svg += "<path class='bline" + (D.champ ? " win" : "") + "' d='M" + (fp.x + CW) + " " + (fp.y + CH / 2) + "H" + (L.cup.x + 6) + "'/>";
    h += "<div class='cup' style='left:" + L.cup.x + "px;top:" + L.cup.y + "px;width:" + (CW - 20) + "px'><div class='t'>" + (D.champ ? "\u{1F451}" : "\u{1F3C6}") + "</div><div class='cn'>" + (D.champ ? esc(D.champ) : "JUARA") + "</div></div>";
    if (D.third) { h += "<div class='third-l' style='left:" + L.pos.third.x + "px;top:" + (L.pos.third.y - 22) + "px'>Perebutan Juara 3</div>" + cardHtml(D.third, L.pos.third, rd.third); }
    var bi = $("binner"); bi.style.width = L.W + "px"; bi.style.height = L.H + "px"; bi.style.transform = "scale(" + zoom + ")";
    bi.innerHTML = "<svg width='" + L.W + "' height='" + L.H + "' style='position:absolute;left:0;top:0;pointer-events:none'>" + svg + "</svg>" + h;
    $("bsize").style.width = (L.W * zoom) + "px"; $("bsize").style.height = (L.H * zoom) + "px";
    $("bscroll").setAttribute("data-w", L.W);
  }
  function renderChips(D) {
    var el = $("rchips"), cur = currentRound(D), h = "";
    D.rounds.forEach(function (rr, r) { h += "<button class='rc" + (cur === r ? " on" : "") + "' data-r='" + r + "'>" + roundName(r, D.R) + "</button>"; });
    el.innerHTML = h;
  }
  function currentRound(D) {
    var bs = $("bscroll"), x = bs.scrollLeft / zoom, r = Math.max(0, Math.min(D.R - 1, Math.round((x - PADL) / (CW + GX))));
    return r;
  }
  function renderTop(D) {
    var C = counts(D), pct = C.total ? Math.round(C.done / C.total * 100) : 0, live = $("live"), rd = readyList(D);
    $("prog-box").style.display = "block"; $("prog").style.width = pct + "%"; $("progt").textContent = C.done + " dari " + C.total + " pertandingan selesai (" + pct + "%)";
    live.className = "live " + (D.champ ? "end" : (C.done > 0 ? "on" : "")); $("live-t").textContent = D.champ ? "SELESAI" : (C.done > 0 ? "LIVE" : "SEGERA");
    var dt = state.date ? new Date(state.date + "T12:00:00") : null;
    $("sub").textContent = (dt ? dt.toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" }) + " · " : "") + state.n + " pemain · gugur 1 hari";
    var ch = $("champ"), nx = $("next");
    if (D.champ) {
      ch.innerHTML = "<div class='panel champ'><h3>Juara HLN81 CUP</h3><div style='font-size:40px'>\u{1F451}</div><div class='cn'>" + esc(D.champ) + "</div><div class='hint' style='font-size:12px'>" +
        (D.runner ? "\u{1F948} " + esc(D.runner) : "") + (D.thirdW ? " &nbsp; \u{1F949} " + esc(D.thirdW) : "") + "</div></div>";
      nx.innerHTML = "";
      showChamp(D);
    } else {
      ch.innerHTML = "";
      nx.innerHTML = "<div class='panel'><h3>Giliran main</h3>" + (rd.length ? rd.slice(0, 4).map(function (m) {
        return "<div class='nx'><div class='vs'><b>" + esc(m.p1) + "</b> vs <b>" + esc(m.p2) + "</b><small>" + (m.isThird ? "Perebutan Juara 3" : roundName(m.r, D.R)) + "</small></div>" + (ADMIN ? "<button data-id='" + m.id + "'>Isi skor</button>" : "") + "</div>";
      }).join("") : "<div class='hint'>Menunggu pemenang babak sebelumnya...</div>") + "</div>";
    }
  }
  function renderAll() {
    if (!state) { $("board").style.display = "none"; $("empty").style.display = ""; $("prog-box").style.display = "none"; $("next").innerHTML = ""; $("champ").innerHTML = ""; renderAdmin(); return; }
    var D = derive(state);
    $("empty").style.display = "none"; $("board").style.display = "";
    renderTop(D); renderBoard(D); renderChips(D); renderAdmin(D);
    if (firstDraw) { firstDraw = false; }
  }

  // ---------- admin ----------
  function renderAdmin(D) {
    var el = $("admin"); if (!ADMIN) { el.style.display = "none"; return; }
    el.style.display = "";
    if (el.getAttribute("data-mode") === (state ? "run" : "setup") && el.firstChild && !DEMO && state) { return; }
    el.setAttribute("data-mode", state ? "run" : "setup");
    var cfg = syncCfg;
    var h = "<div class='panel'><h3>Panel admin</h3>";
    if (!state) {
      h += "<div class='hint' style='margin:0 0 8px'>Tulis nama pemain, satu per baris. Bracket otomatis menyesuaikan jumlah pemain (2 sampai 32), dengan BYE untuk yang ganjil.</div><textarea id="+'"names"'+" placeholder='Contoh:\nYudhi\nAnas\nFirman'></textarea><div class='hint' id='cnt'></div>" +
        "<label class='ck'><input type='checkbox' id='rnd' checked> Undi acak posisi (kalau dimatikan, urutan = unggulan)</label>" +
        "<label class='ck'><input type='checkbox' id='thr' checked> Ada perebutan juara 3</label>" +
        "<div class='row'><button class='btn' id='mk'>\u{1F3B2} Undi &amp; buat bracket</button></div>";
    } else {
      h += "<div class='hint' style='margin:0 0 8px'>Ketuk pertandingan (atau “Isi skor”) untuk memasukkan hasil. Pemenang maju otomatis.</div>" +
        "<div class='row'><button class='btn sec' id='rs'>Bracket baru / reset</button><button class='btn sec' id='cp'>Salin data (manual)</button></div>";
    }
    h += "<details><summary>Sinkron ke penonton (Apps Script)</summary><div class='hint'>Supaya teman bisa melihat bracket live, isi URL web app Apps Script (yang sama dengan webhook bot) dan kunci rahasia (sama dengan <b>HLN_KUNCI</b> di script). Tersimpan hanya di browser ini.</div>" +
      "<input type='text' id='sy-url' placeholder='https://script.google.com/macros/s/.../exec' value='" + esc(cfg.url || "") + "' style='margin-top:6px'>" +
      "<input type='password' id='sy-key' placeholder='Kunci rahasia' value='" + esc(cfg.key || "") + "' style='margin-top:6px'>" +
      "<div class='row'><button class='btn sec' id='sy-save'>Simpan &amp; kirim</button></div><div class='hint' id='sync-msg'>" + esc(syncMsg) + "</div>" +
      "<div class='hint'>Alternatif tanpa Apps Script: buat tab bernama <b>HLN Cup</b> di Google Sheet, lalu tempel hasil “Salin data” ke sel <b>A2</b> setiap kali ingin memperbarui.</div></details></div>";
    el.innerHTML = h;
    if (!state) {
      var ta = $("names"), cnt = $("cnt");
      ta.addEventListener("input", function () { var n = parseNames(ta.value).length, S = n >= 2 ? nextPow2(n) : 0; cnt.textContent = n + " pemain" + (S ? " → bracket " + S + " slot" + (S - n ? " (" + (S - n) + " BYE)" : "") : "") + (n > 32 ? " — maksimal 32" : ""); });
      $("mk").onclick = function () {
        var names = parseNames(ta.value); if (names.length < 2) { toast("Minimal 2 pemain"); return; } if (names.length > 32) { toast("Maksimal 32 pemain"); return; }
        var rnd = $("rnd").checked, thr = $("thr").checked;
        doDraw(names, rnd, function () { state = create(names, rnd, thr); firstDraw = true; $("admin").removeAttribute("data-mode"); persist(); });
      };
    } else {
      $("rs").onclick = function () { if (confirm("Hapus bracket ini dan mulai yang baru? Hasil yang sudah dimasukkan akan hilang.")) { state = null; sel = null; lsSet(LS_STATE, ""); $("admin").removeAttribute("data-mode"); renderAll(); if (syncCfg.url) { /* bracket kosong tidak dikirim; tab sheet tetap berisi data lama sampai bracket baru dibuat */ } } };
      $("cp").onclick = function () { var t = JSON.stringify(state); if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function () { toast("Data disalin. Tempel di sel A2 tab “HLN Cup”."); }, function () { prompt("Salin data ini:", t); }); else prompt("Salin data ini:", t); };
    }
    $("sy-save").onclick = function () { syncCfg = { url: $("sy-url").value.trim(), key: $("sy-key").value.trim() }; lsSet(LS_SYNC, JSON.stringify(syncCfg)); if (state) pushRemote(); else setSync("Tersimpan. Akan dikirim saat bracket dibuat."); };
  }
  function doDraw(names, rnd, done) {
    if (!rnd) { done(); return; }
    var ov = $("drum-ov"), dr = $("drum"), t = 0, iv; ov.style.display = "flex";
    iv = setInterval(function () { dr.textContent = names[Math.floor(Math.random() * names.length)]; t += 70; if (t >= 1900) { clearInterval(iv); dr.textContent = "✨"; setTimeout(function () { ov.style.display = "none"; done(); }, 350); } }, 70);
  }

  // ---------- modal skor ----------
  var cur = null;
  function openScore(id) {
    if (!ADMIN || !state) return;
    var D = derive(state), mt = allMatches(D).filter(function (m) { return m.id === id; })[0];
    if (!mt || !mt.p1 || !mt.p2 || mt.bye) return;
    cur = { id: id, p1: mt.p1, p2: mt.p2, s1: mt.s1 === null ? 0 : mt.s1, s2: mt.s2 === null ? 0 : mt.s2, pw: mt.pw, had: !!state.results[id], title: mt.isThird ? "Perebutan Juara 3" : roundName(mt.r, D.R) };
    drawScore(); $("sc-ov").style.display = "flex";
  }
  function drawScore() {
    var c = cur, tie = c.s1 === c.s2;
    $("sc-card").innerHTML = "<div style='text-align:center;font-family:Oswald,sans-serif;letter-spacing:3px;color:var(--gold);font-size:12px;text-transform:uppercase'>" + esc(c.title) + "</div>" +
      "<div class='sc' style='margin-top:8px'><div class='nm'>" + esc(c.p1) + "</div><div class='st'><button data-k='s1-'>&minus;</button><b>" + c.s1 + "</b><button data-k='s1+'>+</button></div></div>" +
      "<div class='sc'><div class='nm'>" + esc(c.p2) + "</div><div class='st'><button data-k='s2-'>&minus;</button><b>" + c.s2 + "</b><button data-k='s2+'>+</button></div></div>" +
      (tie ? "<div class='hint' style='margin-top:8px;color:var(--gold)'>Skor seri. Pilih pemenang adu penalti:</div><div class='pk'><button data-pw='1' class='" + (c.pw === c.p1 ? "on" : "") + "'>" + esc(c.p1) + "</button><button data-pw='2' class='" + (c.pw === c.p2 ? "on" : "") + "'>" + esc(c.p2) + "</button></div>" : "") +
      "<div class='row' style='justify-content:flex-end'>" + (c.had ? "<button class='btn dg' data-k='del'>Hapus hasil</button>" : "") + "<button class='btn sec' data-k='cancel'>Batal</button><button class='btn' data-k='save'>Simpan</button></div>";
  }
  $("sc-card").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("button") : null; if (!b || !cur) return;
    var k = b.getAttribute("data-k"), pw = b.getAttribute("data-pw");
    if (pw) { cur.pw = pw === "1" ? cur.p1 : cur.p2; drawScore(); return; }
    if (k === "s1+") cur.s1 = Math.min(99, cur.s1 + 1); else if (k === "s1-") cur.s1 = Math.max(0, cur.s1 - 1);
    else if (k === "s2+") cur.s2 = Math.min(99, cur.s2 + 1); else if (k === "s2-") cur.s2 = Math.max(0, cur.s2 - 1);
    else if (k === "cancel") { $("sc-ov").style.display = "none"; cur = null; return; }
    else if (k === "del") { delete state.results[cur.id]; $("sc-ov").style.display = "none"; cur = null; persist(); return; }
    else if (k === "save") {
      if (cur.s1 === cur.s2 && cur.pw !== cur.p1 && cur.pw !== cur.p2) { toast("Pilih pemenang adu penalti"); return; }
      state.results[cur.id] = { a: cur.p1, b: cur.p2, s1: cur.s1, s2: cur.s2, pw: cur.s1 === cur.s2 ? cur.pw : null };
      $("sc-ov").style.display = "none"; cur = null; persist(); return;
    }
    if (cur.s1 !== cur.s2) cur.pw = null;
    drawScore();
  });

  // ---------- juara ----------
  function confetti(cv) {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight, cols = ["#F5D90A", "#6BD40F", "#F3F1E7", "#60A5FA", "#F472B6"], ps = [], i;
    for (i = 0; i < 170; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 2.4, vy: 2 + Math.random() * 3.6, r: 4 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length] });
    var t0 = null;
    function f(ts) { if (t0 === null) t0 = ts; c.clearRect(0, 0, W, H); ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.a += p.va; c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.c; c.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * 0.6); c.restore(); }); if (ts - t0 < 7000 && $("ch-ov").style.display !== "none") requestAnimationFrame(f); else c.clearRect(0, 0, W, H); }
    requestAnimationFrame(f);
  }
  function showChamp(D) {
    var key = D.champ + "|" + state.ts0, seen = lsGet(LS_CHAMP);
    var id = D.champ + "@" + state.date + "#" + state.n + "#" + state.slots.join(",");
    if (seen === id || DEMO) return;
    var el = $("ch-ov");
    el.innerHTML = "<canvas id='ch-cv'></canvas><div class='in'><div class='cr'>\u{1F451}</div><h2>JUARA HLN81 CUP</h2><div class='nm'>" + esc(D.champ) + "</div><div class='pd'>" + (D.runner ? "\u{1F948} Runner-up: <b>" + esc(D.runner) + "</b><br>" : "") + (D.thirdW ? "\u{1F949} Juara 3: <b>" + esc(D.thirdW) + "</b><br>" : "") + "</div><div class='row' style='justify-content:center'><button class='btn' id='ch-x'>Lihat bracket</button></div></div>";
    el.style.display = "flex"; confetti($("ch-cv"));
    $("ch-x").onclick = function () { el.style.display = "none"; lsSet(LS_CHAMP, id); };
  }

  // ---------- interaksi umum ----------
  $("binner").addEventListener("click", function (e) {
    var p = e.target.closest ? e.target.closest(".bp[data-p]") : null, c = e.target.closest ? e.target.closest(".bm") : null;
    if (ADMIN && c && c.classList.contains("adm")) { openScore(c.getAttribute("data-id")); return; }
    if (p) { var n = p.getAttribute("data-p"); sel = sel === n ? null : n; renderAll(); return; }
    if (sel) { sel = null; renderAll(); }
  });
  $("next").addEventListener("click", function (e) { var b = e.target.closest ? e.target.closest("button[data-id]") : null; if (b) openScore(b.getAttribute("data-id")); });
  $("rchips").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".rc") : null; if (!b) return;
    $("bscroll").scrollTo({ left: (PADL + Number(b.getAttribute("data-r")) * (CW + GX) - 10) * zoom, behavior: "smooth" });
  });
  var scT = null;
  $("bscroll").addEventListener("scroll", function () { clearTimeout(scT); scT = setTimeout(function () { if (state) renderChips(derive(state)); }, 80); }, { passive: true });
  function setZoom(z) { zoom = Math.max(0.6, Math.min(1.3, z)); if (state) renderBoard(derive(state)); }
  $("zi").onclick = function () { setZoom(zoom + 0.15); }; $("zo").onclick = function () { setZoom(zoom - 0.15); };
  $("share").onclick = function () {
    if (!state) return; var D = derive(state), rd = readyList(D), t = "\u{1F3C6} HLN81 CUP\n";
    if (D.champ) t += "\u{1F451} Juara: " + D.champ + (D.runner ? "\n\u{1F948} " + D.runner : "") + (D.thirdW ? "\n\u{1F949} " + D.thirdW : "") + "\n";
    else { var C = counts(D); t += C.done + "/" + C.total + " pertandingan selesai\n"; if (rd.length) t += "\nSiap main:\n" + rd.slice(0, 3).map(function (m) { return "• " + m.p1 + " vs " + m.p2 + " (" + (m.isThird ? "Juara 3" : roundName(m.r, D.R)) + ")"; }).join("\n") + "\n"; }
    t += "\nBracket live: " + SITE;
    if (navigator.share) navigator.share({ text: t }).catch(function () {}); else window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank", "noopener");
  };
  $("sc-ov").addEventListener("click", function (e) { if (e.target === $("sc-ov")) { $("sc-ov").style.display = "none"; cur = null; } });

  // ---------- start ----------
  if (DEMO) {
    var nm = ["Yudhi", "Anas", "Firman", "Yans", "Muyik", "Aji", "Wawan", "Gala", "David", "Iskandar", "Andhika", "Aldo", "Dodi", "Eko", "Fajar", "Gita"].slice(0, Math.max(2, Math.min(32, DEMO)));
    state = create(nm, false, true); state.date = new Date().toISOString().slice(0, 10);
    var D0 = derive(state), guard = 0;
    while (guard++ < 60) { var rl = readyList(D0); if (!rl.length || (qs.get("upto") && counts(D0).done >= parseInt(qs.get("upto"), 10))) break; var m0 = rl[0]; state.results[m0.id] = { a: m0.p1, b: m0.p2, s1: 2 + (guard % 3), s2: guard % 2, pw: null }; D0 = derive(state); }
  } else {
    var saved = lsGet(LS_STATE), cached = lsGet(LS_REMOTE);
    try { if (saved) state = JSON.parse(saved); } catch (e) {}
    if (!state && !ADMIN) { try { if (cached) state = JSON.parse(cached); } catch (e) {} }
  }
  renderAll();
  pollRemote();
  if (!DEMO) setInterval(pollRemote, 15000);
  if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
})();
</script>
</body>
