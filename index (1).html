<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klasemen SHB League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#0B1F17;
    --pitch-panel:#122E22;
    --pitch-line:#1F4D37;
    --gold:#E8B33D;
    --chalk:#F3F1E7;
    --muted:#8FAF9B;
    --red:#C4573F;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--pitch-dark);font-family:'Inter',sans-serif;color:var(--chalk);padding:32px 16px 60px;}
  .board{max-width:640px;margin:0 auto;}
  .board-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--pitch-line);padding-bottom:16px;margin-bottom:6px;}
  .brand{display:flex;align-items:center;gap:14px;}
  .crest{width:52px;height:52px;object-fit:contain;flex-shrink:0;}
  .eyebrow{font-size:13px;color:var(--muted);margin:0 0 4px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;letter-spacing:0.5px;margin:0;line-height:1;}
  .updated{font-family:'Oswald',sans-serif;text-align:right;color:var(--gold);font-size:13px;display:flex;align-items:center;gap:7px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;flex-shrink:0;animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{
    0%,100%{opacity:1;}
    50%{opacity:0.25;}
  }
  @media (prefers-reduced-motion: reduce){
    .live-dot{animation:none;}
  }
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  thead th{font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;color:var(--muted);text-align:center;padding:10px 4px;border-bottom:1px solid var(--pitch-line);}
  thead th:nth-child(2){text-align:left;}
  tbody td{padding:11px 4px;text-align:center;font-size:14px;border-bottom:1px solid rgba(31,77,55,0.5);}
  tbody tr:nth-child(even){background:var(--pitch-panel);}
  tbody td:nth-child(2){text-align:left;font-weight:600;}
  .rank{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;width:34px;}
  .poin{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:var(--gold);}
  tr.top3{border-left:3px solid var(--gold);}
  tr.top3 td:first-child{padding-left:8px;}
  tr.bottom3{border-left:3px solid var(--red);}
  tr.bottom3 td:first-child{padding-left:8px;}
  .sg-pos{color:#8FD4A8;}
  .sg-neg{color:var(--red);}
  .legend{display:flex;gap:20px;margin-top:18px;font-size:12px;color:var(--muted);}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px;}
  .dot.gold{background:var(--gold);}
  .dot.red{background:var(--red);}
  .status{color:var(--muted);font-size:13px;margin-top:16px;}
</style>
</head>

  var RANGE = "M2:V50";        // header di baris 2, data sampai baris 50
  // -----------------------------------------------

  window.google = { visualization: { Query: { setResponse: function (response) {
    try {
      var table = response.table;
      var rows = table.rows.map(function (r) {
        return r.c.map(function (cell) { return cell ? cell.v : null; });
      });
      renderRows(rows);
      document.getElementById("status").textContent = "";
    } catch (err) {
      document.getElementById("status").textContent = "Gagal memuat data: " + err.message;
    }
  }}}};

  function renderRows(rows) {
    var data = rows.filter(function (r) { return r[1]; }); // buang baris tanpa nama
    var total = data.length;
    var html = data.map(function (row, idx) {
      var zone = idx < 3 ? "top3" : (idx >= total - 3 ? "bottom3" : "");
      var sg = row[8];
      var sgClass = sg > 0 ? "sg-pos" : (sg < 0 ? "sg-neg" : "");
      var sgLabel = sg > 0 ? "+" + sg : sg;
      return (
        '<tr class="' + zone + '">' +
        "<td class='rank'>" + row[0] + "</td>" +
        "<td>" + row[1] + "</td>" +
        "<td>" + row[2] + "</td>" +
        "<td>" + row[3] + "</td>" +
        "<td>" + row[4] + "</td>" +
        "<td>" + row[5] + "</td>" +
        "<td>" + row[6] + "</td>" +
        "<td>" + row[7] + "</td>" +
        "<td class='" + sgClass + "'>" + sgLabel + "</td>" +
        "<td class='poin'>" + row[9] + "</td>" +
        "</tr>"
      );
    }).join("");
    document.getElementById("rows").innerHTML = html;
  }

  function loadKlasemen() {
    var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID +
      "/gviz/tq?tqx=out:json&gid=" + GID +
      "&range=" + RANGE;
    var script = document.createElement("script");
    script.src = url;
    script.onerror = function () {
      document.getElementById("status").textContent =
        "Gagal memuat data. Pastikan sheet sudah dibagikan sebagai \"Anyone with the link\". (URL: " + url + ")";
    };
    console.log("Memuat dari:", url);
    document.body.appendChild(script);
  }

  loadKlasemen();
</script>
