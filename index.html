<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klasemen SHB League</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#0B1F17;
    --pitch-panel:#122E22;
    --pitch-line:#1F4D37;
    --gold:#E8B33D;
    --chalk:#F3F1E7;
    --muted:#8FAF9B;
    --red:#C4573F;
    --win:#2F8F5B;
    --draw:#C9A227;
    --lose:#2A3F35;
  }
  *{box-sizing:border-box;}
  html{scrollbar-width:thin;scrollbar-color:var(--pitch-line) var(--pitch-dark);}
  body{margin:0;background:var(--pitch-dark);font-family:'Inter',sans-serif;color:var(--chalk);padding:32px 16px 60px;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-track{background:var(--pitch-dark);}
  ::-webkit-scrollbar-thumb{background:var(--pitch-line);border-radius:4px;}
  ::-webkit-scrollbar-button{display:none;height:0;width:0;}
  .board{max-width:640px;margin:0 auto;}
  .board-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--pitch-line);padding-bottom:16px;margin-bottom:0;}
  .brand{display:flex;align-items:center;gap:14px;}
  .crest{width:52px;height:52px;object-fit:contain;flex-shrink:0;}
  .eyebrow{font-size:13px;color:var(--muted);margin:0 0 4px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:34px;letter-spacing:0.5px;margin:0;line-height:1;}
  .updated{font-family:'Oswald',sans-serif;text-align:right;color:var(--gold);font-size:13px;display:flex;align-items:center;gap:7px;}
  .live-dot{width:8px;height:8px;border-radius:50%;background:#4ADE80;flex-shrink:0;animation:pulse 2.4s ease-in-out infinite;}
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.25;} }
  @media (prefers-reduced-motion: reduce){ .live-dot{animation:none;} }

  .tabs{display:flex;gap:20px;margin-top:14px;border-bottom:1px solid var(--pitch-line);overflow-x:auto;overflow-y:hidden;}
  .tab-btn{
    background:none;border:none;cursor:pointer;white-space:nowrap;
    font-family:'Oswald',sans-serif;font-size:14px;color:var(--muted);
    padding:10px 2px;border-bottom:2px solid transparent;margin-bottom:-1px;
  }
  .tab-btn.active{color:var(--chalk);border-bottom-color:var(--gold);}

  .view{display:none;}
  .view.active{display:block;}

  table{width:100%;border-collapse:collapse;margin-top:10px;}
  thead th{font-family:'Oswald',sans-serif;font-weight:500;font-size:12px;color:var(--muted);text-align:center;padding:10px 4px;border-bottom:1px solid var(--pitch-line);}
  thead th:nth-child(2){text-align:left;}
  tbody td{padding:11px 4px;text-align:center;font-size:14px;border-bottom:1px solid rgba(31,77,55,0.5);}
  tbody tr:nth-child(even){background:var(--pitch-panel);}
  tbody td:nth-child(2){text-align:left;font-weight:600;}
  .rank{font-family:'Oswald',sans-serif;font-size:16px;font-weight:600;width:34px;}
  .poin{font-family:'Oswald',sans-serif;font-weight:700;font-size:16px;color:var(--gold);}
  tr.top3{border-left:3px solid var(--gold);}
  tr.top3 td:first-child{padding-left:8px;}
  tr.bottom3{border-left:3px solid var(--red);}
  tr.bottom3 td:first-child{padding-left:8px;}
  .sg-pos{color:#8FD4A8;}
  .sg-neg{color:var(--red);}
  .legend{display:flex;gap:20px;margin-top:18px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .legend .dot{display:inline-block;width:8px;height:8px;border-radius:1px;margin-right:6px;}
  .dot.gold{background:var(--gold);}
  .dot.red{background:var(--red);}
  .dot.win{background:var(--win);}
  .dot.draw{background:var(--draw);}
  .dot.lose{background:var(--lose);}
  .status{color:var(--muted);font-size:13px;margin-top:16px;}

  /* --- matrik pertemuan --- */
  .matrix-scroll{overflow-x:auto;overflow-y:hidden;margin-top:16px;padding-bottom:4px;}
  table.matrix{border-collapse:separate;border-spacing:0;width:auto;margin-top:0;}
  table.matrix th, table.matrix td{
    border-bottom:1px solid rgba(31,77,55,0.5);
    text-align:center;
    padding:0;
  }
  table.matrix thead th{
    height:74px;width:34px;min-width:34px;
    vertical-align:bottom;padding-bottom:6px;position:relative;
    border-bottom:1px solid var(--pitch-line);
  }
  table.matrix thead th span{
    display:inline-block;transform:rotate(-40deg);transform-origin:left bottom;
    white-space:nowrap;font-family:'Oswald',sans-serif;font-size:12px;color:var(--muted);
  }
  table.matrix thead th:first-child{background:var(--pitch-dark);}
  table.matrix tbody th{
    font-family:'Inter',sans-serif;font-weight:600;font-size:13px;text-align:left;
    padding:0 10px 0 4px;white-space:nowrap;position:sticky;left:0;
    background:var(--pitch-dark);z-index:1;
  }
  table.matrix tbody tr:nth-child(even) th{background:var(--pitch-panel);}
  table.matrix td{
    width:34px;min-width:34px;height:34px;
    font-family:'Oswald',sans-serif;font-size:13px;font-weight:600;color:var(--chalk);
  }
  table.matrix td.mx-win{background:var(--win);}
  table.matrix td.mx-draw{background:var(--draw);color:#2a2109;}
  table.matrix td.mx-lose{background:var(--lose);color:var(--muted);}
  table.matrix td.mx-self{background:#000;color:var(--pitch-line);}

  /* --- hasil pertandingan --- */
  .match-week{
    font-family:'Oswald',sans-serif;font-size:12px;color:var(--muted);
    margin:20px 0 4px;padding-bottom:6px;border-bottom:1px solid var(--pitch-line);
  }
  .match-week:first-child{margin-top:12px;}
  .match-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid rgba(31,77,55,0.5);}
  .match-team{flex:1;font-size:14px;min-width:0;}
  .match-team.home{text-align:right;}
  .match-team.away{text-align:left;}
  .match-team.winner{color:var(--gold);font-weight:700;}
  .match-score{
    font-family:'Oswald',sans-serif;font-weight:700;font-size:15px;
    padding:4px 12px;margin:0 12px;white-space:nowrap;
    background:var(--pitch-panel);border-radius:3px;flex-shrink:0;
  }
  .hasil-controls{display:flex;gap:10px;margin-top:14px;}
  .search-box{
    flex:1;padding:10px 12px;
    background:var(--pitch-panel);border:1px solid var(--pitch-line);border-radius:4px;
    color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;
    min-width:0;
  }
  .search-box::placeholder{color:var(--muted);}
  .search-box:focus{outline:none;border-color:var(--gold);}
  .filter-select{
    -webkit-appearance:none;-moz-appearance:none;appearance:none;
    padding:10px 28px 10px 10px;
    background-color:var(--pitch-panel);border:1px solid var(--pitch-line);border-radius:4px;
    color:var(--chalk);font-family:'Oswald',sans-serif;font-size:13px;
    flex-shrink:0;max-width:150px;
    background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%238FAF9B' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
    background-repeat:no-repeat;
    background-position:right 10px center;
    background-size:10px 7px;
  }
  .filter-select:focus{outline:none;border-color:var(--gold);}
  .filter-select option{background:var(--pitch-panel);color:var(--chalk);}
  .match-empty{text-align:center;padding:24px 0;color:var(--muted);font-size:13px;}

  /* --- riwayat --- */
  .hof-card-container {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 16px;
    margin-bottom: 16px;
  }
  .hof-card {
    background: var(--pitch-panel);
    border: 1px solid var(--pitch-line);
    border-radius: 8px;
    padding: 12px 8px;
    text-align: center;
  }
  .hof-card.champion {
    border-color: var(--gold);
    background: linear-gradient(180deg, rgba(232, 179, 61, 0.2) 0%, var(--pitch-panel) 100%);
  }
  .hof-card .trophy { font-size: 22px; margin-bottom: 2px; }
  .hof-card .rank-title { font-family: 'Oswald', sans-serif; font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .hof-card .player-name { font-size: 15px; font-weight: 700; color: var(--chalk); margin: 4px 0; }
  .hof-card.champion .player-name { color: var(--gold); }
  .hof-card .player-stats { font-family: 'Oswald', sans-serif; font-size: 12px; color: var(--muted); }

  .season-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 10px;
    background: rgba(18, 46, 34, 0.6);
    border: 1px solid var(--pitch-line);
    padding: 10px 14px;
    border-radius: 6px;
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 16px;
    text-align: center;
  }
  .season-summary-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .season-summary-item label {
    font-size: 11px;
    color: var(--muted);
  }
  .season-summary-item span {
    color: var(--chalk);
    font-weight: 700;
    font-size: 13px;
  }
</style>
</head>
