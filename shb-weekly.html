<style>
:root{--bg:#0B1F17;--panel:#122E22;--line:#1F4D37;--gold:#E8B33D;--chalk:#F3F1E7;--muted:#8FAF9B;--win:#4ADE80;--lose:#F87171}

html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -10%,rgba(232,179,61,.18),transparent 50%),var(--bg);color:var(--chalk);font-family:'Inter',sans-serif;min-height:100vh;padding:0 0 60px}
.wrap{max-width:980px;margin:0 auto;padding:0 14px}

.hero{text-align:center;padding:18px 0 8px}

.zoom{display:flex;gap:6px;justify-content:flex-end;margin-bottom:6px}
.zoom button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--chalk);font-size:16px;cursor:pointer}

.rl{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px dashed var(--line);font-size:14px}.rl:first-child{border-top:0}.rl .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.rl .tg{font-size:11px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--muted);cursor:pointer}.rl .tg.on{border-color:var(--gold);background:rgba(232,179,61,.18);color:var(--gold);font-weight:600}.rl input[type=checkbox]{width:18px;height:18px}

.btn.wa{background:rgba(37,211,102,.12);border-color:#25D366;color:#4ADE80}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea,input[type=text],input[type=password]{width:100%;background:#0a1912;border:1px solid var(--line);border-radius:10px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;padding:10px}
textarea{min-height:150px;resize:vertical}
label.ck{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:8px}
.hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:6px}

.sc{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px dashed var(--line)}
.sc:first-of-type{border-top:0}
.sc .nm{flex:1;font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis}
.sc .st{display:flex;align-items:center;gap:10px}
.sc .st button{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:22px;cursor:pointer}
.sc .st b{font-family:'Oswald',sans-serif;font-size:32px;min-width:34px;text-align:center}
.pk{display:flex;gap:8px;margin-top:8px}
.pk button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--chalk);cursor:pointer;font-size:13px}
.pk button.on{border-color:var(--gold);background:rgba(232,179,61,.18);color:var(--gold);font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000;border:1px solid var(--gold);color:var(--chalk);padding:9px 16px;border-radius:99px;font-size:12px;z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
.toast.on{opacity:1}
.empty{text-align:center;padding:36px 12px;color:var(--muted);font-size:14px;line-height:1.7}
.drum{font-family:'Oswald',sans-serif;font-size:34px;text-align:center;color:var(--gold);letter-spacing:2px;min-height:48px;margin:14px 0}
.ch-ov{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 30%,rgba(232,179,61,.28),rgba(5,16,11,0) 70%),#06130D;display:none;align-items:center;justify-content:center;padding:18px;text-align:center}
.ch-ov canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

.ch-ov .cr{font-size:70px;animation:float 1.6s ease-in-out infinite}
.ch-ov h2{font-family:'Oswald',sans-serif;letter-spacing:5px;font-size:15px;color:var(--gold);margin:6px 0}

@media (prefers-reduced-motion:reduce){.hero .tr,.bm.ready,.live.on i,.ch-ov .cr{animation:none}}
details{margin-top:12px}
summary{cursor:pointer;color:var(--gold);font-size:13px}
</style>

<script>
(function () {
  "use strict";
  var SHEET_ID = "1QHPqO4LEjtR7c6Lp-K8uqJaZnCdfuzAomgwUajF4RbQ", SHEET_TAB = "SHB Weekly Cup";
  var LS_RESET = "shbw_reset_ts", LS_STATE = "shbw_state_v1", LS_SYNC = "hln_sync_v1", LS_REMOTE = "shbw_remote_v1", LS_CHAMP = "shbw_champ_seen";
  var CUP_NAME = "SHB Weekly Cup", LS_LOGGED = "shbw_logged";
  var qs = new URLSearchParams(location.search), ADMIN = qs.has("admin"), DEMO = parseInt(qs.get("demo"), 10) || 0;
  var SITE = "https://iihduy.github.io/SHB-League/shb-weekly.html";
  var CW = 160, CH = 62, GX = 42, PADT = 38, PADL = 14, UNIT = 80;

  var state = null, sel = null, zoom = 1, shown = {}, firstDraw = true;
  function $(id) { return document.getElementById(id); }
  function esc(t) { return String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/'/g, "&#39;").replace(/"/g, "&quot;"); }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(function () { el.classList.remove("on"); }, 2600); }

  // ---------- model ----------
  function nextPow2(n) { var p = 1; while (p < n) p *= 2; return p; }
  function seedOrder(S) {
    var a = [1];
    while (a.length < S) { var n = [], t = a.length * 2 + 1; a.forEach(function (x) { n.push(x, t - x); }); a = n; }
    return a;
  }
  function rapi(n) { return n.trim().replace(/\s+/g, " ").split(" ").map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase(); }).join(" "); }
  function parseNames(txt) {
    var seen = {}, out = [];
    txt.split(/[\n,;]+/).forEach(function (x) { x = rapi(x); if (!x) return; var k = x.toLowerCase(); if (seen[k]) return; seen[k] = 1; out.push(x); });
    return out;
  }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function create(names, rnd, third, top, edition) {
    top = (top || []).filter(function (t) { return names.indexOf(t) >= 0; });
    var rest = names.filter(function (x) { return top.indexOf(x) < 0; });
    var n = names.length, S = nextPow2(n), seeds = rnd ? shuffle(top).concat(shuffle(rest)) : top.concat(rest);
    var slots = seedOrder(S).map(function (s) { return s <= n ? seeds[s - 1] : null; });
    return { v: 1, title: "SHB Weekly Cup", n: n, S: S, slots: slots, third: !!third && S >= 4, top: top, edition: edition || "", results: {}, ts: Date.now(), date: new Date().toISOString().slice(0, 10) };
  }
  function resolve(mt, st) {
    var res = st.results[mt.id];
    if (mt.r === 0 && ((mt.p1 === null) !== (mt.p2 === null))) { mt.bye = true; mt.winner = mt.p1 || mt.p2; mt.done = true; return; }
    if (mt.p1 && mt.p2 && res && res.a === mt.p1 && res.b === mt.p2) {
      mt.s1 = res.s1; mt.s2 = res.s2; mt.pw = res.pw || null;
      var w = res.s1 > res.s2 ? mt.p1 : (res.s2 > res.s1 ? mt.p2 : (res.pw === mt.p1 || res.pw === mt.p2 ? res.pw : null));
      if (w) { mt.winner = w; mt.loser = w === mt.p1 ? mt.p2 : mt.p1; mt.done = true; }
    }
  }
  function derive(st) {
    var R = Math.round(Math.log(st.S) / Math.log(2)), rounds = [], r, m;
    for (r = 0; r < R; r++) {
      var arr = [], cnt = st.S / Math.pow(2, r + 1);
      for (m = 0; m < cnt; m++) {
        var mt = { id: "r" + r + "m" + m, r: r, m: m, p1: null, p2: null, s1: null, s2: null, pw: null, winner: null, loser: null, done: false, bye: false };
        if (r === 0) { mt.p1 = st.slots[2 * m]; mt.p2 = st.slots[2 * m + 1]; }
        else { mt.p1 = rounds[r - 1][2 * m].winner; mt.p2 = rounds[r - 1][2 * m + 1].winner; }
        resolve(mt, st); arr.push(mt);
      }
      rounds.push(arr);
    }
    var third = null;
    if (st.third && R >= 2) {
      var sm = rounds[R - 2];
      if (sm.length === 2 && !sm[0].bye && !sm[1].bye) {
        third = { id: "third", r: R - 1, m: 1, p1: sm[0].loser, p2: sm[1].loser, s1: null, s2: null, pw: null, winner: null, loser: null, done: false, bye: false, isThird: true };
        resolve(third, st);
      }
    }
    var fin = rounds[R - 1][0];
    return { R: R, rounds: rounds, third: third, champ: fin.winner, fin: fin, runner: fin.loser, thirdW: third ? third.winner : null };
  }
  function roundName(r, R) {
    var d = R - 1 - r;
    if (r === 0 && R >= 4) return "Babak 1";
    return d === 0 ? "Final" : d === 1 ? "Semifinal" : d === 2 ? "Perempat Final" : d === 3 ? "16 Besar" : "32 Besar";
  }
  function allMatches(D) { var a = []; D.rounds.forEach(function (rr) { rr.forEach(function (m) { a.push(m); }); }); if (D.third) a.push(D.third); return a; }
  function readyList(D) {
    return allMatches(D).filter(function (m) { return m.p1 && m.p2 && !m.done && !m.bye; }).sort(function (a, b) {
      var ka = a.isThird ? D.R - 1.5 : a.r, kb = b.isThird ? D.R - 1.5 : b.r; return ka - kb || a.m - b.m; });
  }
  function counts(D) { var real = allMatches(D).filter(function (m) { return !m.bye && !(m.r === 0 && (m.p1 === null || m.p2 === null)); }); return { total: real.length, done: real.filter(function (m) { return m.done; }).length }; }

  // ---------- simpan & sinkron ----------
  var syncCfg = (function () { try { return JSON.parse(lsGet(LS_SYNC) || "{}"); } catch (e) { return {}; } })();
  var syncTimer = null, syncMsg = "";
  function persist() {
    state.ts = Date.now();
    if (!DEMO) lsSet(LS_STATE, JSON.stringify(state));
    renderAll();
    if (ADMIN && !DEMO) { clearTimeout(syncTimer); syncTimer = setTimeout(pushRemote, 900); }
  }
  function pushRemote(payload) {
    payload = payload || state;
    if (!syncCfg.url || !syncCfg.key) { setSync("Mode lokal: bracket belum terbagi ke penonton. Atur sinkron di bawah, atau salin data manual."); return; }
    setSync("Mengirim ke sheet...");
    var ts = payload.ts;
    try {
      fetch(syncCfg.url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ action: "hln_save", sheet: SHEET_TAB, key: syncCfg.key, data: payload }) })
        .then(function () { setTimeout(function () { readRemote(function (r) { setSync(r && r.ts === ts ? "✓ Tersinkron ke sheet, penonton sudah bisa melihat." : "⚠ Belum terbaca di sheet. Cek URL, kunci, dan deploy ulang Apps Script (Versi baru)."); }); }, 4000); })
        .catch(function () { setSync("⚠ Gagal mengirim. Cek koneksi."); });
    } catch (e) { setSync("⚠ Gagal mengirim."); }
  }

  function champId() { if (!state) return ""; var D = derive(state); return CUP_NAME + "|" + state.date + "|" + (state.edition || "") + "|" + (D.champ || ""); }
  function logChampion() {
    if (!state) return; var D = derive(state); if (!D.champ) return;
    if (!syncCfg.url || !syncCfg.key) { toast("Isi URL dan kunci di bagian Sinkron dulu"); return; }
    var body = { action: "cup_champion", key: syncCfg.key, cup: CUP_NAME, date: new Date().toLocaleDateString("sv-SE", { timeZone: "Asia/Jakarta" }), edition: state.edition || "", champion: D.champ, runner: D.runner || "", third: D.thirdW || "" };
    var msg = $("lg-msg"); if (msg) msg.textContent = "Mengirim...";
    fetch(syncCfg.url, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(body) })
      .then(function () { lsSet(LS_LOGGED, champId()); toast("Juara dicatat ke riwayat liga"); if (msg) msg.textContent = "\u2713 Terkirim ke tab Piala di sheet."; })

    else if (k === "del") { delete state.results[cur.id]; $("sc-ov").style.display = "none"; cur = null; persist(); return; }
    else if (k === "save") {
      if (cur.s1 === cur.s2 && cur.pw !== cur.p1 && cur.pw !== cur.p2) { toast("Pilih pemenang adu penalti"); return; }
      state.results[cur.id] = { a: cur.p1, b: cur.p2, s1: cur.s1, s2: cur.s2, pw: cur.s1 === cur.s2 ? cur.pw : null };
      $("sc-ov").style.display = "none"; cur = null; persist(); return;
    }
    if (cur.s1 !== cur.s2) cur.pw = null;
    drawScore();
  });

  // ---------- juara ----------
  function confetti(cv) {
    if (window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var c = cv.getContext("2d"), W = cv.width = innerWidth, H = cv.height = innerHeight, cols = ["#E8B33D", "#4ADE80", "#F3F1E7", "#60A5FA", "#F472B6"], ps = [], i;
    for (i = 0; i < 170; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 2.4, vy: 2 + Math.random() * 3.6, r: 4 + Math.random() * 5, a: Math.random() * 6, va: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length] });
    var t0 = null;
    function f(ts) { if (t0 === null) t0 = ts; c.clearRect(0, 0, W, H); ps.forEach(function (p) { p.x += p.vx; p.y += p.vy; p.a += p.va; c.save(); c.translate(p.x, p.y); c.rotate(p.a); c.fillStyle = p.c; c.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * 0.6); c.restore(); }); if (ts - t0 < 7000 && $("ch-ov").style.display !== "none") requestAnimationFrame(f); else c.clearRect(0, 0, W, H); }
    requestAnimationFrame(f);
  }
  function showChamp(D) {
    var key = D.champ + "|" + state.ts0, seen = lsGet(LS_CHAMP);
    var id = D.champ + "@" + state.date + "#" + state.n + "#" + state.slots.join(",");
    if (seen === id || DEMO) return;
    var el = $("ch-ov");
    el.innerHTML = "<canvas id='ch-cv'></canvas><div class='in'><div class='cr'>\u{1F451}</div><h2>JUARA SHB WEEKLY CUP</h2><div class='nm'>" + esc(D.champ) + "</div><div class='pd'>" + (D.runner ? "\u{1F948} Runner-up: <b>" + esc(D.runner) + "</b><br>" : "") + (D.thirdW ? "\u{1F949} Juara 3: <b>" + esc(D.thirdW) + "</b><br>" : "") + "</div><div class='row' style='justify-content:center'><button class='btn' id='ch-x'>Lihat bracket</button></div></div>";
    el.style.display = "flex"; confetti($("ch-cv"));
    $("ch-x").onclick = function () { el.style.display = "none"; lsSet(LS_CHAMP, id); };
  }

  // ---------- interaksi umum ----------
  $("binner").addEventListener("click", function (e) {
    var p = e.target.closest ? e.target.closest(".bp[data-p]") : null, c = e.target.closest ? e.target.closest(".bm") : null;
    if (ADMIN && c && c.classList.contains("adm")) { openScore(c.getAttribute("data-id")); return; }
    if (p) { var n = p.getAttribute("data-p"); sel = sel === n ? null : n; renderAll(); return; }
    if (sel) { sel = null; renderAll(); }
  });
  $("next").addEventListener("click", function (e) { var b = e.target.closest ? e.target.closest("button[data-id]") : null; if (b) openScore(b.getAttribute("data-id")); });
  $("rchips").addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".rc") : null; if (!b) return;
    $("bscroll").scrollTo({ left: (PADL + Number(b.getAttribute("data-r")) * (CW + GX) - 10) * zoom, behavior: "smooth" });
  });
  var scT = null;
  $("bscroll").addEventListener("scroll", function () { clearTimeout(scT); scT = setTimeout(function () { if (state) renderChips(derive(state)); }, 80); }, { passive: true });
  function setZoom(z) { zoom = Math.max(0.6, Math.min(1.3, z)); if (state) renderBoard(derive(state)); }
  $("zi").onclick = function () { setZoom(zoom + 0.15); }; $("zo").onclick = function () { setZoom(zoom - 0.15); };
  $("share").onclick = function () {
    if (!state) return; var D = derive(state), rd = readyList(D), t = "\u{1F3C6} SHB WEEKLY CUP\n";
    if (D.champ) t += "\u{1F451} Juara: " + D.champ + (D.runner ? "\n\u{1F948} " + D.runner : "") + (D.thirdW ? "\n\u{1F949} " + D.thirdW : "") + "\n";
    else { var C = counts(D); t += C.done + "/" + C.total + " pertandingan selesai\n"; if (rd.length) t += "\nSiap main:\n" + rd.slice(0, 3).map(function (m) { return "• " + m.p1 + " vs " + m.p2 + " (" + (m.isThird ? "Juara 3" : roundName(m.r, D.R)) + ")"; }).join("\n") + "\n"; }
    t += "\nBracket live: " + SITE;
    if (navigator.share) navigator.share({ text: t }).catch(function () {}); else window.open("https://wa.me/?text=" + encodeURIComponent(t), "_blank", "noopener");
  };
  $("sc-ov").addEventListener("click", function (e) { if (e.target === $("sc-ov")) { $("sc-ov").style.display = "none"; cur = null; } });

  // ---------- start ----------
  if (DEMO) {
    var nm = ["Yudhi", "Anas", "Firman", "Yans", "Muyik", "Aji", "Wawan", "Gala", "David", "Iskandar", "Andhika", "Aldo", "Dodi", "Eko", "Fajar", "Gita"].slice(0, Math.max(2, Math.min(32, DEMO)));
    state = create(nm, false, true, nm.slice(0, 4)); state.date = new Date().toISOString().slice(0, 10);
    var D0 = derive(state), guard = 0;
    while (guard++ < 60) { var rl = readyList(D0); if (!rl.length || (qs.get("upto") && counts(D0).done >= parseInt(qs.get("upto"), 10))) break; var m0 = rl[0]; state.results[m0.id] = { a: m0.p1, b: m0.p2, s1: 2 + (guard % 3), s2: guard % 2, pw: null }; D0 = derive(state); }
  } else {
    var saved = lsGet(LS_STATE), cached = lsGet(LS_REMOTE);
    try { if (saved) state = JSON.parse(saved); } catch (e) {}
    if (!state && !ADMIN) { try { if (cached) state = JSON.parse(cached); } catch (e) {} }
  }
  renderAll();
  if (ADMIN && !state) loadRoster();
  pollRemote();
  if (!DEMO) setInterval(pollRemote, 15000);
  if ("serviceWorker" in navigator && location.protocol === "https:") window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
})();
</script>
